<!DOCTYPE html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arbeidsdag</title>
<style>
body{font-family:system-ui,sans-serif;margin:0 auto;padding:14px;max-width:640px;font-size:18px;background:#f4f5f7;color:#222}
h1{font-size:26px;margin:6px 0 14px}h2{font-size:21px;margin:0 0 10px}
section{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px}
textarea,input[type=text]{width:100%;box-sizing:border-box;font-size:17px;padding:10px;border:1px solid #ccc;border-radius:8px;font-family:inherit}
.add{display:flex;gap:8px;margin-bottom:10px}.add input{flex:1;min-width:0}
button{font-size:17px;padding:10px 14px;border:0;border-radius:8px;background:#2f855a;color:#fff;min-height:46px}
.item{border:1px solid #e2e2e2;border-radius:12px;padding:10px;margin-top:10px}
.item.done{background:#f0fff4;border-color:#9ae6b4}
.top{display:flex;align-items:center;gap:10px}
.top span{flex:1;font-weight:600;word-break:break-word}.item.done .top span{text-decoration:line-through;color:#777}
input[type=checkbox]{width:32px;height:32px;flex:none}
.item textarea{margin-top:8px;min-height:60px;font-size:16px}
.del{background:#e2e8f0;color:#333;padding:6px 10px;min-height:38px;font-size:15px}
.q{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.q span{flex:1}
small{color:#666}
</style></head><body>
<h1>Arbeidsdag</h1>
<section><h2>Sjekkliste</h2>
<div class="add"><input type="text" id="ci" placeholder="Nytt punkt"><button id="ca">Legg til</button></div>
<div id="cl"></div><small>Notat ved hvert punkt lagres automatisk</small></section>
<section><h2>Notater</h2><textarea id="notes" style="min-height:110px" placeholder="Generelle notater..."></textarea></section>
<section><h2>Spørsmål</h2>
<div class="add"><input type="text" id="qi" placeholder="Nytt spørsmål"><button id="qa">Legg til</button></div><div id="ql"></div></section>
<script>
const L=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}},S=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const n=document.getElementById('notes');n.value=localStorage.getItem('ad_notes')||'';n.oninput=()=>localStorage.setItem('ad_notes',n.value);
let C=L('ad_check'),Q=L('ad_q');
function el(t,x,c){const e=document.createElement(t);if(x)e.textContent=x;if(c)e.className=c;return e}
function render(){
const cl=document.getElementById('cl');cl.innerHTML='';
C.forEach((it,i)=>{const box=el('div','','item'+(it.d?' done':''));const top=el('div','','top');
const cb=el('input');cb.type='checkbox';cb.checked=!!it.d;cb.onchange=()=>{it.d=cb.checked;S('ad_check',C);render()};
const d=el('button','Slett','del');d.onclick=()=>{if(confirm('Slette punktet?')){C.splice(i,1);S('ad_check',C);render()}};
top.append(cb,el('span',it.t),d);const ta=el('textarea');ta.placeholder='Notat til dette punktet...';ta.value=it.n||'';ta.oninput=()=>{it.n=ta.value;S('ad_check',C)};
box.append(top,ta);cl.append(box)});
const ql=document.getElementById('ql');ql.innerHTML='';
Q.forEach((t,i)=>{const r=el('div','','q');const d=el('button','Slett','del');d.onclick=()=>{Q.splice(i,1);S('ad_q',Q);render()};r.append(el('span','❓ '+t),d);ql.append(r)})}
function add(inp,f){const v=inp.value.trim();if(v){f(v);inp.value='';render()}else inp.focus()}
const ci=document.getElementById('ci'),qi=document.getElementById('qi');
document.getElementById('ca').onclick=()=>add(ci,v=>{C.push({t:v,d:false,n:''});S('ad_check',C)});
document.getElementById('qa').onclick=()=>add(qi,v=>{Q.push(v);S('ad_q',Q)});
ci.onkeydown=e=>{if(e.key==='Enter')document.getElementById('ca').click()};qi.onkeydown=e=>{if(e.key==='Enter')document.getElementById('qa').click()};
render();
</script></body></html>
